name: Build MotoSquad Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ☕ Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🐦 Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 📦 Generate Android Platform Project
        run: |
          rm -rf android
          flutter create --org com.motosquad --project-name motosquad --platforms android .

      - name: 🛡️ Inject Android Internet & Location Permissions
        run: |
          python3 -c "
          p = 'android/app/src/main/AndroidManifest.xml'
          content = open(p).read()
          perms = '''
              <uses-permission android:name=\"android.permission.INTERNET\"/>
              <uses-permission android:name=\"android.permission.ACCESS_NETWORK_STATE\"/>
              <uses-permission android:name=\"android.permission.ACCESS_FINE_LOCATION\"/>
              <uses-permission android:name=\"android.permission.ACCESS_COARSE_LOCATION\"/>
              <uses-permission android:name=\"android.permission.FOREGROUND_SERVICE\"/>
              <uses-permission android:name=\"android.permission.WAKE_LOCK\"/>
          '''
          content = content.replace('<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\">', '<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\">' + perms)
          content = content.replace('<application', '<application android:usesCleartextTraffic=\"true\"')
          open(p, 'w').write(content)
          print('Injected Android permissions successfully.')
          "

      - name: 📦 Install Flutter Dependencies
        run: flutter pub get

      - name: 🔨 Build Android Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: 🚀 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MotoSquad-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
